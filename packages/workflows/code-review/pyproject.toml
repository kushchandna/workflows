[project]
name = "workflows-code-review"
version = "0.1.0"
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["workflows-agent", "pydantic>=2"]

[tool.uv.sources]
workflows-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workflows"]
