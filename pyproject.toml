[project]
name = "workflows-workspace"
version = "0"
requires-python = ">=3.11"
dependencies = ["workflows-agent", "workflows-agent-claude-code", "workflows-code-review"]

[tool.uv]
package = false

[tool.uv.sources]
workflows-agent = { workspace = true }
workflows-agent-claude-code = { workspace = true }
workflows-code-review = { workspace = true }

[tool.uv.workspace]
members = ["packages/agents/*", "packages/workflows/*"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "pyright>=1.1.380"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["workflows"]

[tool.pyright]
include = ["packages", "tests"]
pythonVersion = "3.11"
